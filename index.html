<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Sting Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div
      class="h-dvh w-full overflow-x-hidden justify-center flex flex-col"
      id="app"
    >
      <!-- Logo -->
      <div class="flex flex-row justify-center py-6 flex-col flex">
        <div class="items-center justify-center flex flex-col gap-5">
          <img class="w-48 md:w-52 lg:w-52" src="Logo.png" alt="Logo" />
          <img
            class="w-48 md:w-52 lg:w-52"
            src="tagline.png"
            alt="Logo"
            width="auto"
            height="30"
          />
        </div>
        <!-- Game -->
        <div id="status" class="ready"></div>
        <div class="flex flex-row justify-center pt-6 w-auto">
          <div class="lights">
            <!-- COLUMN 1 -->
            <div class="light-column">
              <div class="light top-red"></div>
              <div class="light top-red"></div>
              <div class="light red"></div>
              <div class="light red"></div>
            </div>
            <!-- COLUMN 2 -->
            <div class="light-column">
              <div class="light top-red"></div>
              <div class="light top-red"></div>
              <div class="light red"></div>
              <div class="light red"></div>
            </div>
            <!-- COLUMN 3 -->
            <div class="light-column">
              <div class="light top-red"></div>
              <div class="light top-red"></div>
              <div class="light red"></div>
              <div class="light red"></div>
            </div>
            <!-- COLUMN 4 -->
            <div class="light-column">
              <div class="light top-red"></div>
              <div class="light top-red"></div>
              <div class="light red"></div>
              <div class="light red"></div>
            </div>
            <!-- COLUMN 5 -->
            <div class="light-column">
              <div class="light top-red"></div>
              <div class="light top-red"></div>
              <div class="light red"></div>
              <div class="light red"></div>
            </div>
          </div>
        </div>

        <div
          id="reaction"
          class="flex-row flex justify-center font-sans subpixel-antialiased"
        >
          0.000
        </div>
        <div class="flex flex-row justify-center">
          <button id="startButton" type="button">Start</button>
        </div>
        <!-- LEADERBOARD BUTTON -->
        <div class="mt-6 flex justify-center">
          <button
            id="leaderboardButton"
            class="group flex items-center gap-3 rounded-xl border border-white/10 bg-[#111317] px-6 py-3 text-sm font-black uppercase tracking-[2px] text-white transition-all duration-200 hover:border-red-500/50 hover:bg-red-600 hover:shadow-[0_0_25px_rgba(239,68,68,0.35)] active:scale-95"
          >
            <span class="text-lg">🏆</span>
            <span>Leaderboard</span>
          </button>
        </div>
        <!-- =========================================================
     LEADERBOARD MODAL
========================================================= -->

        <div
          id="leaderboardModal"
          class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 px-4 py-6 backdrop-blur-sm"
        >
          <!-- MODAL -->
          <div id="scores" hidden></div>
          <div
            id="leaderboardPanel"
            class="relative w-full max-w-lg overflow-hidden rounded-2xl border border-white/10 bg-[#0d0f12] shadow-[0_25px_100px_rgba(0,0,0,0.8)]"
          >
            <!-- RED TOP ACCENT -->
            <div
              class="absolute left-0 right-0 top-0 h-1 bg-gradient-to-r from-red-700 via-red-500 to-red-700 shadow-[0_0_20px_rgba(239,68,68,0.7)]"
            ></div>

            <!-- HEADER -->
            <div
              class="flex items-center justify-between border-b border-white/5 px-6 py-5"
            >
              <div class="flex items-center gap-3">
                <div
                  class="grid h-11 w-11 place-items-center rounded-xl border border-yellow-500/20 bg-yellow-500/10 text-xl"
                >
                  🏆
                </div>

                <div>
                  <h2
                    class="text-lg font-black uppercase tracking-[2px] text-white"
                  >
                    Leaderboard
                  </h2>

                  <p
                    class="mt-0.5 text-[10px] font-bold uppercase tracking-[2px] text-gray-500"
                  >
                    Fastest Reaction Times
                  </p>
                </div>
              </div>

              <!-- CLOSE BUTTON -->
              <button
                id="closeLeaderboard"
                class="grid h-9 w-9 place-items-center rounded-lg border border-white/5 bg-white/5 text-gray-400 transition hover:bg-red-500/10 hover:text-red-400"
                aria-label="Close leaderboard"
              >
                ✕
              </button>
            </div>

            <!-- LEADERBOARD CONTENT -->
            <div class="p-5">
              <!-- COLUMN HEADERS -->
              <div
                class="mb-2 grid grid-cols-[45px_1fr_auto] items-center px-4 text-[9px] font-black uppercase tracking-[2px] text-gray-600"
              >
                <span>Pos</span>
                <span>Driver</span>
                <span>Time</span>
              </div>

              <!-- SCORES -->
              <div id="modalLeaderboard" class="space-y-2">
                <!-- JavaScript generates scores here -->
              </div>

              <!-- EMPTY STATE -->
              <div id="emptyLeaderboard" class="hidden py-12 text-center">
                <div class="mb-3 text-4xl opacity-40">🏁</div>

                <p
                  class="text-sm font-bold uppercase tracking-[2px] text-gray-500"
                >
                  No Times Recorded
                </p>

                <p class="mt-2 text-xs text-gray-700">
                  Be the first driver on the grid.
                </p>
              </div>
            </div>

            <!-- FOOTER -->
            <div
              class="flex items-center justify-between border-t border-white/5 bg-black/20 px-5 py-4"
            >
              <div
                class="text-[9px] font-bold uppercase tracking-[1.5px] text-gray-600"
              >
                Top 5 Drivers
              </div>

              <button
                id="resetLeaderboardModal"
                class="rounded-lg border border-red-500/10 bg-red-500/5 px-3 py-2 text-[9px] font-black uppercase tracking-[1.5px] text-red-500/70 transition hover:border-red-500/30 hover:bg-red-500/10 hover:text-red-400"
              >
                Reset Times
              </button>
              <button id="resetButton" type="button" hidden>Reset</button>
            </div>
          </div>
        </div>
        <!-- <div class="flex flex-row justify-center">
          <div class="leaderboard">
            <div class="leaderboard-header">
              <div class="leaderboard-title">Fastest Reactions</div>
            </div>
          </div>
        </div> -->
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
